// Include project afterEvaluate callbacks; Gradle's profile counter omits some of that work.
// Benchmark builds disable configuration cache so these callbacks run on every sample.
def configurationStarted
gradle.projectsLoaded {
    configurationStarted = System.nanoTime()
}
gradle.projectsEvaluated {
    def milliseconds = (System.nanoTime() - configurationStarted) / 1_000_000.0d
    println "CONFIGURATION_PHASE_MS=${milliseconds}"
}
